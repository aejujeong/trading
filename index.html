<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<title>1억 챌린지</title>
<link rel="manifest" href="/manifest.json"/>
<meta name="theme-color" content="#141110"/>
<link rel="icon" href="/icon-192.png"/>
<link rel="apple-touch-icon" href="/icon-192.png"/>

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<style>
  :root{
    --bg:#141110;
    --panel:rgba(239,235,226,0.93);
    --panel2:rgba(226,218,199,0.93);
    --border:rgba(28,25,20,0.18);
    --border-onbg:rgba(241,238,233,0.22);
    --text:#1C1712;
    --page-text:#F3F0EA;
    --dim:#766854;
    --dim2:#9C8F79;
    --accent:#6B5D4A;
    --accent-onbg:#CBB89E;
    --dark:#18130D;
    --dark-text:#F3F0EA;
    --long:#3F6B42;
    --long-dim:rgba(63,107,66,0.14);
    --short:#AE4E33;
    --short-dim:rgba(174,78,51,0.14);
    /* history side (우측: 자본금 / 통계 / 출금 / 히스토리) — 다크 팔레트 */
    --hbg:rgba(30,26,21,0.85);
    --hbg2:rgba(51,44,34,0.85);
    --hborder:rgba(241,238,233,0.2);
    --htext:#F7F5F1;
    --hdim:#C9BFAF;
    --hdim2:#8C8272;
    --haccent:#D6C4B0;
    --hlong:#94B885;
    --hlong-dim:rgba(148,184,133,0.2);
    --hshort:#DA9578;
    --hshort-dim:rgba(218,149,120,0.2);
    --mono:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
    --sans:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo',sans-serif;
  }
  *{box-sizing:border-box;}
  html, body{margin:0;padding:0;width:100%;overflow-x:hidden;}
  #app{
    font-family:var(--sans);
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding:0;
    -webkit-font-smoothing:antialiased;
  }
  .shell{max-width:1180px;margin:0 auto;padding:32px 20px 60px;}
  @media (max-width:860px){
    .shell{padding-top:calc(56px + env(safe-area-inset-top,0px));}
  }
  .topbar{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:30px;flex-wrap:wrap;gap:10px;padding-bottom:18px;border-bottom:1px solid var(--border-onbg);}
  .brand{display:flex;align-items:baseline;gap:11px;position:relative;}
  .brand .tick{font-size:18px;line-height:1;}
  .brand h1{font-size:21px;margin:0;font-weight:700;letter-spacing:-0.4px;color:var(--page-text);}
  .tabs{display:flex;gap:3px;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:3px;}
  .tab{
    padding:7px 15px;border-radius:5px;font-size:13px;font-weight:600;color:var(--dim);
    cursor:pointer;transition:background .15s,color .15s;user-select:none;letter-spacing:.02em;
  }
  .tab.active{background:var(--dark);color:var(--dark-text);}
  .tab:hover:not(.active){color:var(--text);}

  .section-title{
    font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;
    margin:28px 0 12px;font-weight:700;position:relative;padding-left:14px;
  }
  .section-title.on-bg{color:var(--accent-onbg);}
  .section-title.on-hist{color:var(--haccent);}
  .section-title::before{
    content:'';position:absolute;left:0;top:2px;width:6px;height:6px;
    border-left:1px solid currentColor;border-top:1px solid currentColor;
  }
  .section-title:first-child{margin-top:0;}

  .card{
    background:var(--panel);border:1px solid var(--border);border-radius:8px;
    padding:18px 20px;margin-bottom:14px;position:relative;overflow:hidden;
  }
  .wick{position:absolute;left:0;top:0;bottom:0;width:2px;}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-left:8px;}
  .cat-label{font-size:15.5px;font-weight:700;letter-spacing:-0.2px;color:var(--text);}
  .cat-sub{font-size:12.5px;color:var(--dim);padding-left:8px;margin-bottom:12px;}
  textarea{
    width:100%;min-height:64px;background:var(--panel2);border:1px solid var(--border);
    border-radius:6px;color:var(--text);font-family:var(--sans);font-size:14px;
    padding:10px 12px;resize:vertical;line-height:1.55;
  }
  textarea::placeholder{color:var(--dim2);}
  textarea:focus{outline:none;border-color:var(--accent);}

  .save-row{display:flex;justify-content:flex-end;margin-top:18px;align-items:center;gap:10px;}
  .saved-msg{font-size:12px;color:var(--long);opacity:0;transition:opacity .3s;font-family:var(--mono);}
  .saved-msg.show{opacity:1;}
  button.primary{
    background:var(--dark);color:var(--dark-text);border:1px solid var(--dark);border-radius:6px;
    padding:9px 20px;font-size:12.5px;font-weight:700;cursor:pointer;transition:opacity .15s;
    text-transform:uppercase;letter-spacing:.08em;
  }
  button.primary:hover{opacity:.85;}
  button.ghost{
    background:transparent;color:var(--dim);border:1px solid var(--border);border-radius:6px;
    padding:8px 15px;font-size:12px;cursor:pointer;text-transform:uppercase;letter-spacing:.06em;
  }
  button.ghost:hover{color:var(--text);border-color:var(--accent);}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .field{margin-bottom:10px;}
  .field label{display:block;font-size:13px;color:var(--text);margin-bottom:6px;font-weight:700;}
  .field input,.field select{
    width:100%;background:var(--panel2);border:1.5px solid var(--border);border-radius:6px;
    color:var(--text);font-size:14.5px;padding:9px 11px;font-family:var(--mono);font-weight:600;
  }
  .field input::placeholder{color:var(--dim2);}
  .field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
  .field select{font-family:var(--sans);}
  .dir-toggle{display:flex;gap:8px;}
  .dir-btn{
    flex:1;text-align:center;padding:9px;border-radius:6px;border:1.5px solid var(--border);
    cursor:pointer;font-size:14px;font-weight:700;color:var(--dim);background:var(--panel2);
  }
  .dir-btn.long-active{background:var(--long-dim);border-color:var(--long);color:var(--long);}
  .dir-btn.short-active{background:var(--short-dim);border-color:var(--short);color:var(--short);}

  .check-row{display:flex;gap:8px;margin-bottom:8px;}
  .check-item{
    flex:1;display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:9px 12px;
  }
  .check-item .lbl{font-size:13px;color:var(--text);font-weight:600;}
  .yn{display:flex;gap:4px;}
  .yn button{
    border:1px solid var(--border);background:transparent;color:var(--dim2);
    border-radius:5px;width:30px;height:26px;font-size:11px;cursor:pointer;font-weight:700;
  }
  .yn button.y-on{background:var(--long-dim);border-color:var(--long);color:var(--long);}
  .yn button.n-on{background:var(--short-dim);border-color:var(--short);color:var(--short);}

  .ref-hint{
    font-size:12.5px;color:var(--hdim);background:var(--hbg2);border-left:2px solid var(--haccent);
    padding:7px 11px;margin-bottom:10px;border-radius:0 5px 5px 0;line-height:1.55;
  }
  .pct-input{
    width:28px;background:transparent;border:none;border-bottom:1px dashed currentColor;
    color:inherit;font-family:var(--mono);font-size:inherit;font-weight:inherit;
    text-align:center;padding:0 1px;
  }
  .pct-input:focus{outline:none;border-bottom-style:solid;}

  .log-layout{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:start;position:relative;}
  .log-col-right{position:sticky;top:20px;padding-left:32px;border-left:1px dashed var(--border-onbg);}
  @media (max-width:860px){
    .log-layout{grid-template-columns:1fr;overflow:hidden;}
    .log-col-right{position:static;padding-left:0;border-left:none;}
    .log-col-left, .log-col-right{display:none;}
    .log-col-left.mobile-active, .log-col-right.mobile-active{display:block;}
  }
  @media (min-width:861px){
    .log-col-left, .log-col-right{display:block !important;}
  }
  .history-panel{background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;padding:16px 18px;max-height:calc(100vh - 160px);overflow-y:auto;}
  .history-panel .section-title{margin-top:0;color:var(--haccent);}

  .stats-row{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
  .stat{background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;padding:13px 15px;}
  .stat .k{font-size:11.5px;color:var(--hdim);margin-bottom:5px;letter-spacing:.02em;}
  .stat .v{font-family:var(--mono);font-size:20px;font-weight:700;color:var(--htext);}

  .trade-row{
    background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;
    padding:12px 14px;margin-bottom:8px;border-left:3px solid var(--hdim2);cursor:pointer;
  }
  .trade-row.long{border-left-color:var(--hlong);}
  .trade-row.short{border-left-color:var(--hshort);}
  .trade-top{display:flex;justify-content:space-between;align-items:center;}
  .trade-name{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;color:var(--htext);}
  .dir-badge{font-size:10.5px;padding:2px 6px;border-radius:4px;font-weight:700;}
  .dir-badge.long{background:var(--hlong-dim);color:var(--hlong);}
  .dir-badge.short{background:var(--hshort-dim);color:var(--hshort);}
  .trade-pnl{font-family:var(--mono);font-weight:700;font-size:14.5px;}
  .trade-date{font-size:11.5px;color:var(--hdim);font-family:var(--mono);}
  .trade-detail{margin-top:10px;padding-top:10px;border-top:1px solid var(--hborder);font-size:13px;color:var(--hdim);}
  .trade-detail .q{color:var(--hdim);margin-top:8px;font-size:12px;font-weight:600;}
  .trade-detail .a{color:var(--htext);margin-top:2px;}
  .trade-detail .field label{color:var(--htext);}
  .trade-detail .field input,.trade-detail .field select{
    background:var(--hbg2);border-color:var(--hborder);color:var(--htext);
  }
  .trade-detail .field input::placeholder{color:var(--hdim2);}
  .trade-detail .check-item{background:var(--hbg2);border-color:var(--hborder);}
  .trade-detail .check-item .lbl{color:var(--htext);}
  .empty{text-align:center;color:var(--hdim);padding:40px 0;font-size:13px;}
  .del-btn{font-size:11px;color:var(--hdim2);background:none;border:none;cursor:pointer;margin-top:10px;}
  .del-btn:hover{color:var(--hshort);}
  .chip-del:hover{color:var(--short) !important;}
  .ticker-option:hover{background:var(--panel);}
  .pos{color:var(--hlong);} .neg{color:var(--hshort);} .neu{color:var(--hdim);}
</style>

    {key:'익절', label:'익절', sub:'1차·2차 목표 / 잔여 물량 / 본절 이동 / 트레일링', color:'var(--long)'},

    익절: '하루 수익 → 2% / 주간 수익 → 13% / 단기 이평선·지지·저항 기준 50% 익절',

  let state = {
    tab: 'log',
    currentPerson: null,
    personLoading: false,
    currentJournal: 'main',
    journals: DEFAULT_JOURNALS,
    journalDropdownOpen: false,
    settings: {},

    pnlView: 'daily',
  };

  function esc(s){
    return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function liveOr(id, fallback){
    const el = document.getElementById(id);
    return el ? el.value : (fallback ?? '');
  }
  function fmtNum(n){
    if(n==null || isNaN(n)) return '0';
    return Math.trunc(Number(n)).toLocaleString();
  }
  function fmtUsdt(n){
    if(n==null || isNaN(n)) return '0';
    return Number(n).toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2});
  }
  function fmtPrice(n){
    if(n==null || isNaN(n)) return '0';
    return Math.trunc(n).toLocaleString();
  }
  function toNum(v){
    if(v==null) return NaN;
    return parseFloat(String(v).replace(/,/g,''));
  }
  function resizeImageFile(file, maxDim=900, quality=0.72){
    return new Promise((resolve, reject)=>{
      const reader = new FileReader();
      reader.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          let w = img.width, h = img.height;
          if(w>maxDim || h>maxDim){
            if(w>h){ h = Math.round(h*maxDim/w); w = maxDim; }
            else { w = Math.round(w*maxDim/h); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = reader.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
  function formatPlain(raw){
    if(raw==null || raw==='') return '';
    let cleaned = String(raw).replace(/[^0-9.]/g,'');
    const firstDot = cleaned.indexOf('.');
    if(firstDot!==-1){
      cleaned = cleaned.slice(0,firstDot+1) + cleaned.slice(firstDot+1).replace(/\./g,'');
    }
    const parts = cleaned.split('.');
    let intPart = parts[0]||'';
    const dec = parts.length>1 ? '.'+parts[1].slice(0,2) : '';
    if(intPart==='') return dec;
    return Number(intPart).toLocaleString() + dec;
  }
  function reformatWithCursor(input){
    const original = input.value;
    const cursor = input.selectionStart;
    const digitsBeforeCursor = original.slice(0, cursor).replace(/[^0-9]/g,'').length;
    const formatted = formatPlain(original);
    input.value = formatted;
    let count = 0, pos = formatted.length;
    for(let i=0;i<formatted.length;i++){
      if(/[0-9]/.test(formatted[i])) count++;
      if(count === digitsBeforeCursor){ pos = i+1; break; }
    }
    if(digitsBeforeCursor===0) pos = 0;
    input.setSelectionRange(pos, pos);
  }
  function calcTargets(dir, entry){
    const e = toNum(entry);
    if(isNaN(e) || e<=0) return null;
    const tPct = (toNum(state.targetPct) || 6)/100;
    const sPct = (toNum(state.stopPct) || 2)/100;
    const target = dir==='long' ? e*(1+tPct) : e*(1-tPct);
    const stop = dir==='long' ? e*(1-sPct) : e*(1+sPct);
    return {target, stop};
  }

  // ---- partial-sell calculations ----
  function sellsSoldPct(t){
    return (t.sells||[]).reduce((s,x)=> s + (toNum(x.pct)||0), 0);
  }
  function tradeRemainingPct(t){
    return Math.max(0, 100 - sellsSoldPct(t));
  }
  function tradeRemainingAmount(t){
    return (toNum(t.amount)||0) * tradeRemainingPct(t) / 100;
  }
  function sellPnlPct(t, price){
    const entry = toNum(t.entry);
    if(!entry) return 0;
    return t.dir==='long' ? (price-entry)/entry : (entry-price)/entry;
  }
  function sellLeverage(sell){
    const lev = toNum(sell.leverage);
    return (!isNaN(lev) && lev>0) ? lev : 1;
  }
  function sellLeveragedPct(t, sell){
    return sellPnlPct(t, toNum(sell.price)) * sellLeverage(sell);
  }
  function sellRealizedAmount(t, sell){
    const portion = (toNum(t.amount)||0) * (toNum(sell.pct)||0) / 100;
    const rawPnl = portion * sellLeveragedPct(t, sell);
    const feeRatePct = toNum(t.feeRatePct) || 0;
    if(feeRatePct<=0) return rawPnl;
    const sellNotional = portion + rawPnl;
    const fee = (portion + sellNotional) * (feeRatePct/100);
    return rawPnl - fee;
  }
  function tradeRealizedPnl(t){
    return (t.sells||[]).reduce((s,x)=> s + sellRealizedAmount(t,x), 0);
  }
  function tradeIsFullyClosed(t){
    return sellsSoldPct(t) >= 99.999;
  }
  function tradeFinalReturnPct(t){
    const amt = toNum(t.amount)||0;
    return amt ? (tradeRealizedPnl(t)/amt*100) : null;
  }

  // ---- pnl breakdown by period ----
  function allSellEvents(){
    const out = [];
    state.trades.forEach(t=>{
      (t.sells||[]).forEach(s=>{
        out.push({ date: s.date, pnl: sellRealizedAmount(t, s) });
      });
    });
    return out;
  }
  function getMonday(y,m,d){
    const dt = new Date(y, m-1, d);
    const day = dt.getDay();
    const diff = day===0 ? -6 : 1-day;
    const monday = new Date(dt); monday.setDate(dt.getDate()+diff);
    const sunday = new Date(monday); sunday.setDate(monday.getDate()+6);
    return {monday, sunday};
  }
  function groupPnlByPeriod(view){
    const events = allSellEvents();
    const groups = {};
    events.forEach(ev=>{
      const [y,m,d] = ev.date.split('-').map(Number);
      let key, label, sortKey;
      if(view==='daily'){
        key = ev.date;
        label = `${y}.${String(m).padStart(2,'0')}.${String(d).padStart(2,'0')}`;
        sortKey = ev.date;
      } else if(view==='weekly'){
        const {monday, sunday} = getMonday(y,m,d);
        key = monday.toISOString().slice(0,10);
        label = `${monday.getMonth()+1}/${monday.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()}`;
        sortKey = key;
      } else {
        key = `${y}-${String(m).padStart(2,'0')}`;
        label = `${y}년 ${m}월`;
        sortKey = key;
      }
      if(!groups[key]) groups[key] = {label, sortKey, pnl:0};
      groups[key].pnl += ev.pnl;
    });
    return Object.values(groups).sort((a,b)=> b.sortKey.localeCompare(a.sortKey));
  }

  const LS_PREFIX = 'trading-journal:';
  function nsKey(key){
    let k = key;
    if(k!=='journals' && state.currentJournal && state.currentJournal!=='main'){
      k = `${k}:${state.currentJournal}`;
    }
    if(state.currentPerson === 'jinwoo'){
      k = `jinwoo:${k}`;
    }
    // 애주(기본)는 기존에 쓰던 키 그대로 사용 (하위 호환)
    return k;
  }
  async function storageGet(key, fallback){
    const k = nsKey(key);
    if(supabaseClient){
      try{
        const { data, error } = await supabaseClient.from('app_data').select('value').eq('key', k).maybeSingle();
        if(!error) return data ? data.value : fallback;
        console.error('supabase get error', error);
      }catch(e){ console.error('supabase get exception', e); }
    }
    try{
      if(window.storage && window.storage.get){
        const r = await window.storage.get(k,false);
        return r ? JSON.parse(r.value) : fallback;
      }
    }catch(e){}
    try{
      const raw = localStorage.getItem(LS_PREFIX+k);
      return raw!=null ? JSON.parse(raw) : fallback;
    }catch(e){ return fallback; }
  }
  async function storageSet(key, value){
    const k = nsKey(key);
    if(supabaseClient){
      try{
        const { error } = await supabaseClient.from('app_data').upsert({ key:k, value, updated_at:new Date().toISOString() });
        if(!error) return;
        console.error('supabase set error', error);
      }catch(e){ console.error('supabase set exception', e); }
    }
    try{
      if(window.storage && window.storage.set){
        await window.storage.set(k, JSON.stringify(value), false);
        return;
      }
    }catch(e){}
    try{ localStorage.setItem(LS_PREFIX+k, JSON.stringify(value)); }
    catch(e){ console.error('storage error', e); }
  }

  async function importAllData(backup){
    if(!backup || typeof backup!=='object' || !backup.data) throw new Error('invalid backup file');
    const savedJournal = state.currentJournal;
    const journalsList = (backup.journals && backup.journals.length) ? backup.journals : DEFAULT_JOURNALS;
    state.journals = journalsList;
    await storageSet('journals', journalsList);
    for(const jid of Object.keys(backup.data)){
      state.currentJournal = jid;
      const d = backup.data[jid] || {};
      await storageSet('settings', d.settings || {});
      await storageSet('trades', d.trades || []);
      await storageSet('customTickers', d.customTickers || []);
      await storageSet('capital', d.capital!=null ? d.capital : 1000000);
      await storageSet('withdrawals', d.withdrawals || []);
      await storageSet('pctSettings', d.pctSettings || {target:6, stop:2});
      await storageSet('usdtRate', d.usdtRate!=null ? d.usdtRate : 1380);
    }
    state.currentJournal = savedJournal;

  }

              <div style="display:flex;gap:8px;margin-top:8px;align-items:center;">

        ${CATS.map(c=>{
          const checked = formChecklist[c.key] ?? (editing && editing.checklist ? editing.checklist[c.key] : false) ?? false;

        <div class="section-title" style="margin-top:20px;">복기</div>

          <textarea id="f-why" style="min-height:44px;font-family:var(--sans)" placeholder="진입 이유...">${esc(fieldVal('f-why', editing?editing.why:''))}</textarea>

  function renderTradeRow(t){
    const open = t._open;
    const sells = t.sells || [];
    const remainingPct = tradeRemainingPct(t);
    const remainingAmt = tradeRemainingAmount(t);
    const fullyClosed = tradeIsFullyClosed(t);
    const realizedPnl = tradeRealizedPnl(t);
    const finalReturn = tradeFinalReturnPct(t);

    const headerRight = sells.length===0
      ? `<span class="trade-pnl neu">${t.amount?fmtNum(toNum(t.amount))+'원':''} <span style="font-size:10px;color:var(--hdim2);font-weight:600;margin-left:4px;">보유 중</span></span>`
      : fullyClosed
        ? `<span class="trade-pnl ${realizedPnl>0?'pos':realizedPnl<0?'neg':'neu'}">${realizedPnl>0?'+':''}${fmtNum(realizedPnl)}원${finalReturn!=null?` <span style="font-size:11px;margin-left:4px;opacity:.8;">(${finalReturn>0?'+':''}${finalReturn.toFixed(2)}%)</span>`:''}</span>`
        : `<span class="trade-pnl ${realizedPnl>0?'pos':realizedPnl<0?'neg':'neu'}">${realizedPnl>0?'+':''}${fmtNum(realizedPnl)}원 <span style="font-size:10px;color:var(--hdim2);font-weight:600;margin-left:4px;">부분매도 · ${remainingPct.toFixed(1)}%남음</span></span>`;

    const sellFormOpen = t._sellFormOpen;
    const editingSellId = t._editingSellId;
    const editingSell = editingSellId!=null ? sells.find(s=>s.id===editingSellId) : null;
    const suggest = calcTargets(t.dir, t.entry);

    const sellFormHtml = sellFormOpen ? `
      <div class="field" style="margin-top:10px;">
        ${renderPctSuggestBox(suggest, t.id, 'var(--hlong)', 'var(--hshort)')}
        <div class="ref-hint">남은 비중 ${remainingPct.toFixed(1)}% · 남은 금액 ${fmtNum(remainingAmt)}원</div>
        <div class="grid2">
          <div class="field"><label>매도가격</label>
            <input id="sell-price-${t.id}" inputmode="decimal" placeholder="0" value="${esc(liveOr('sell-price-'+t.id, editingSell?formatPlain(String(editingSell.price)):''))}"/></div>
          <div class="field"><label>매도비율(%)</label>
            <input id="sell-pct-${t.id}" inputmode="decimal" placeholder="0" value="${esc(liveOr('sell-pct-'+t.id, editingSell? String(editingSell.pct) : String(Number(remainingPct.toFixed(1)))))}"/></div>
        </div>
        <div class="field"><label>레버리지 (배수, 안 썼으면 1)</label>
          <input id="sell-leverage-${t.id}" inputmode="decimal" placeholder="1" value="${esc(liveOr('sell-leverage-'+t.id, editingSell && editingSell.leverage ? String(editingSell.leverage) : '1'))}"/></div>
        <div class="save-row" style="margin-top:8px;">
          <button class="ghost" data-action="cancel-sell-form" data-id="${t.id}">취소</button>
          <button class="primary" data-action="save-sell" data-id="${t.id}" data-sell-id="${editingSell?editingSell.id:''}">${editingSell?'매도 수정 저장':'매도 저장'}</button>
        </div>
      </div>
    ` : (remainingPct>0.0001 ? `
      <button class="primary" style="margin-top:10px;width:100%;" data-action="toggle-sell-form" data-id="${t.id}">매도 기록하기</button>
    ` : '');

    const sellListHtml = sells.length>0 ? `
      <div style="margin-top:10px;">
        ${sells.map((s,i)=>{
          const amt = sellRealizedAmount(t, s);
          const portion = (toNum(t.amount)||0) * (toNum(s.pct)||0) / 100;
          const pct = portion ? (amt/portion*100) : 0;
          const lev = sellLeverage(s);
          return `
          <div class="ref-hint" style="border-left-color:${amt>=0?'var(--hlong)':'var(--hshort)'};display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;">
            <span>${i+1}차 매도 · 가격 ${esc(s.price)} · 비율 ${s.pct}%${lev!==1?` · ${lev}배`:''} · 손익 <b class="${amt>0?'pos':amt<0?'neg':'neu'}">${amt>0?'+':''}${fmtNum(amt)}원 (${pct>0?'+':''}${pct.toFixed(2)}%)</b></span>
            <span style="display:flex;gap:8px;flex-shrink:0;">
              <button class="del-btn" style="margin-top:0;color:var(--hdim)" data-action="edit-sell" data-id="${t.id}" data-sell-id="${s.id}">수정</button>
              <button class="del-btn" style="margin-top:0;" data-action="delete-sell" data-id="${t.id}" data-sell-id="${s.id}">삭제</button>
            </span>
          </div>`;
        }).join('')}
      </div>
    ` : '';

    return `
      <div class="trade-row ${t.dir}" data-action="toggle-row" data-id="${t.id}">
        <div class="trade-top">
          <span class="trade-name">${esc(t.ticker)}<span class="dir-badge ${t.dir}">${t.dir==='long'?'롱':'숏'}</span><a href="${tvUrl(t.ticker)}" target="_blank" rel="noopener" onclick="event.stopPropagation()" style="text-decoration:none;font-size:12px;opacity:.85;" title="TradingView에서 보기">📈</a></span>
          ${headerRight}
        </div>
        <div class="trade-date">${t.date} · 진입 ${esc(t.entry)}${t.amount?` · 투자금액 ${fmtNum(toNum(t.amount))}원${t.amountUsdt?` (${fmtUsdt(t.amountUsdt)} USDT)`:''}`:''}</div>
        ${open ? `
        <div class="trade-detail" data-stop-propagation="1">
          ${CATS.filter(c=> t.checklistNotes && t.checklistNotes[c.key]).map(c=>`<div class="q">${c.label}</div><div class="a">${esc(t.checklistNotes[c.key])}</div>`).join('')}
          ${t.why?`<div class="q">왜 들어갔나</div><div class="a">${esc(t.why)}</div>`:''}
          ${t.ruleKept?`<div class="q">규칙을 지켰나</div><div class="a">${esc(t.ruleKept)}</div>`:''}
          ${t.mistake?`<div class="q">반복 실수</div><div class="a">${esc(t.mistake)}</div>`:''}
          ${t.photos && t.photos.length>0 ? `
          <div class="q">첨부 사진</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;">
            ${t.photos.map(p=>`<img src="${p}" data-action="view-photo" data-photo="${p}" style="width:56px;height:56px;object-fit:cover;border-radius:6px;border:1px solid var(--hborder);cursor:zoom-in;"/>`).join('')}
          </div>` : ''}
          ${sellListHtml}
          ${sellFormHtml}
          <div style="display:flex;gap:14px;margin-top:10px;">
            <button class="del-btn" style="color:var(--hdim)" data-action="edit-trade" data-id="${t.id}">수정</button>
            <button class="del-btn" data-action="delete-trade" data-id="${t.id}">삭제</button>
          </div>
        </div>` : ''}
      </div>
    `;
  }

  function renderWithdrawalRow(w){
    const open = w._open;
    return `
      <div class="trade-row" style="border-left-color:var(--haccent);" data-action="toggle-withdrawal-row" data-id="${w.id}">
        <div class="trade-top">
          <span class="trade-name" style="color:var(--haccent);">출금</span>
          <span class="trade-pnl neg">-${fmtNum(toNum(w.amount))}원</span>
        </div>
        <div class="trade-date">${w.date}${w.memo?` · ${esc(w.memo)}`:''}</div>
        ${open ? `
        <div class="trade-detail" data-stop-propagation="1">
          <button class="del-btn" style="margin-top:0;" data-action="delete-withdrawal" data-id="${w.id}">삭제</button>
        </div>` : ''}
      </div>
    `;
  }

  function renderLogTab(){
    const total = state.trades.length;
    const openAmount = state.trades.reduce((s,t)=> s + tradeRemainingAmount(t), 0);
    const totalPnl = state.trades.reduce((s,t)=> s + tradeRealizedPnl(t), 0);
    const totalReturnPct = state.capital ? (totalPnl/state.capital*100) : 0;
    const totalWithdrawn = state.withdrawals.reduce((s,w)=> s + (toNum(w.amount)||0), 0);
    const equity = state.capital + totalPnl - totalWithdrawn;
    const cashBalance = equity - openAmount;

    const historyItems = [
      ...state.trades.map(t=>({type:'trade', id:t.id, data:t})),
      ...state.withdrawals.map(w=>({type:'withdrawal', id:w.id, data:w})),
    ].sort((a,b)=> b.id - a.id);

    return `
      <div class="log-layout" data-action="swipe-area">
        <div class="log-col-left ${state.mobileView==='form'?'mobile-active':''}">${renderTradeForm()}</div>
        <div class="log-col-right ${state.mobileView==='history'?'mobile-active':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding:10px 14px;background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;">
            <span style="font-size:12px;color:var(--hdim);">시작 자본금</span>
            <span style="font-weight:700;color:var(--htext);">${fmtNum(state.capital)}원</span>
          </div>

          <div class="stats-row">
            <div class="stat"><div class="k">잔액 (투자 가능)</div><div class="v">${fmtNum(cashBalance)}</div></div>
            <div class="stat"><div class="k">투자중 금액</div><div class="v">${fmtNum(openAmount)}</div></div>
            <div class="stat" style="cursor:pointer;" data-action="toggle-pnl-breakdown">
              <div class="k">누적 손익 · 수익률 ${state.showPnlBreakdown?'▲':'▼'}</div>
              <div class="v ${totalPnl>0?'pos':totalPnl<0?'neg':''}">${totalPnl>0?'+':''}${fmtNum(totalPnl)} <span style="font-size:13px;">(${totalReturnPct>0?'+':''}${totalReturnPct.toFixed(2)}%)</span></div>
            </div>
            <div class="stat">
              <div class="k" style="display:flex;justify-content:space-between;align-items:center;">
                <span>총 출금액</span>
                <button class="ghost" style="padding:2px 9px;font-size:10px;" data-action="toggle-withdraw-form">수정</button>
              </div>
              <div class="v">${fmtNum(totalWithdrawn)}</div>
            </div>
          </div>

          ${state.showPnlBreakdown ? `
          <div style="margin-bottom:14px;padding:14px 16px;background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;">
            <div class="tabs" style="margin-bottom:12px;display:inline-flex;">
              <div class="tab ${state.pnlView==='daily'?'active':''}" data-action="pnl-view" data-view="daily">일간</div>
              <div class="tab ${state.pnlView==='weekly'?'active':''}" data-action="pnl-view" data-view="weekly">주간</div>
              <div class="tab ${state.pnlView==='monthly'?'active':''}" data-action="pnl-view" data-view="monthly">월간</div>
            </div>
            ${(()=>{
              const groups = groupPnlByPeriod(state.pnlView);
              if(groups.length===0) return `<div class="empty" style="padding:16px 0;">아직 매도 기록이 없어요.</div>`;
              return groups.map(g=>{
                const pct = state.capital ? (g.pnl/state.capital*100) : 0;
                return `
                <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--hborder);font-size:13px;">
                  <span style="color:var(--hdim);">${g.label}</span>
                  <span class="${g.pnl>0?'pos':g.pnl<0?'neg':'neu'}" style="font-family:var(--mono);font-weight:700;">${g.pnl>0?'+':''}${fmtNum(g.pnl)}원 <span style="font-size:11px;opacity:.85;">(${pct>0?'+':''}${pct.toFixed(2)}%)</span></span>
                </div>`;
              }).join('');
            })()}
          </div>
          ` : ''}

          ${state.showWithdrawForm ? `
          <div style="margin-bottom:14px;padding:14px 16px;background:var(--hbg);border:1px solid var(--hborder);border-radius:8px;">
            <div class="card-head" style="padding-left:0;"><span class="cat-label" style="font-size:13px;color:var(--htext);">출금 기록</span></div>
            <div style="display:flex;gap:8px;margin-top:8px;">
              <input id="withdraw-amount" inputmode="decimal" placeholder="출금액" style="flex:1;font-family:var(--sans);background:var(--hbg2);border:1px solid var(--hborder);border-radius:8px;color:var(--htext);font-size:13.5px;padding:8px 10px;"/>
              <button class="primary" data-action="save-withdrawal">출금 저장</button>
            </div>
          </div>
          ` : ''}

          <div class="history-panel">
            <div class="section-title">기록 히스토리 (총 ${total}건 · 출금 ${state.withdrawals.length}건)</div>
            ${historyItems.length===0
              ? `<div class="empty">아직 기록이 없어요. 왼쪽에서 첫 매매를 기록해보세요.</div>`
              : historyItems.map(item=> item.type==='trade' ? renderTradeRow(item.data) : renderWithdrawalRow(item.data)).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function bindEvents(){
    document.querySelectorAll('[data-action="choose-person"]').forEach(el=>{
      el.addEventListener('click', ()=>{ choosePerson(el.dataset.id); });
    });
    document.querySelectorAll('[data-action="switch-person"]').forEach(el=>{
      el.addEventListener('click', ()=>{ switchPerson(); });
    });
    if(!state.currentPerson) return;

    document.querySelectorAll('[data-action="tab"]').forEach(el=>{
      el.addEventListener('click', ()=>{ state.tab = el.dataset.tab; render(); });
    });

    // 모바일: 스와이프로 매매기록/히스토리 전환
    const swipeArea = document.querySelector('[data-action="swipe-area"]');
    if(swipeArea){
      let touchStartX = null, touchStartY = null;
      swipeArea.addEventListener('touchstart', (e)=>{
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
      }, { passive:true });
      swipeArea.addEventListener('touchend', (e)=>{
        if(touchStartX==null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        const dy = e.changedTouches[0].clientY - touchStartY;
        touchStartX = null;
        if(Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy)) return; // 짧거나 세로 스크롤이면 무시
        if(dx < 0 && state.mobileView==='form'){ state.mobileView = 'history'; render(); }
        else if(dx > 0 && state.mobileView==='history'){ state.mobileView = 'form'; render(); }
      }, { passive:true });
    }

    // 저널(매매기록 페이지) 전환 드롭다운
    document.querySelectorAll('[data-action="toggle-journal-dropdown"]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.journalDropdownOpen = !state.journalDropdownOpen;
        render();
      });
    });
    document.querySelectorAll('[data-action="select-journal"]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        switchJournal(el.dataset.id);
      });
    });
    if(state.journalDropdownOpen){
      document.addEventListener('click', function closeJournalDropdown(){
        state.journalDropdownOpen = false;
        document.removeEventListener('click', closeJournalDropdown);
        render();
      }, { once:true });

        let leverage = leverageInput ? toNum(leverageInput.value) : 1;
        if(isNaN(leverage) || leverage<=0) leverage = 1;
        if(isNaN(price) || price<=0){ alert('매도가격을 정확히 입력해주세요.'); return; }
        if(isNaN(pct) || pct<=0 || pct>100){ alert('매도비율을 1~100 사이로 입력해주세요.'); return; }
        t.sells = t.sells || [];
        const sellId = el.dataset.sellId ? Number(el.dataset.sellId) : null;
        const othersTotal = t.sells.filter(s=>s.id!==sellId).reduce((s,x)=> s+(toNum(x.pct)||0), 0);
        if(othersTotal + pct > 100.001){ alert(`매도 비율 합계가 100%를 넘을 수 없어요. (이미 ${othersTotal.toFixed(1)}% 매도됨)`); return; }
        if(sellId){
          const existing = t.sells.find(s=>s.id===sellId);
          if(existing){ existing.price = price; existing.pct = pct; existing.leverage = leverage; }
        } else {
          t.sells.push({ id: Date.now(), price, pct, leverage, date: new Date().toISOString().slice(0,10) });
        }
        t._sellFormOpen = false;
        t._editingSellId = null;
        await storageSet('trades', state.trades.map(({_open,_closing,_sellFormOpen,_editingSellId, ...rest})=>rest));
        render();
      });
    });

    // trade row toggle / edit / delete
    document.querySelectorAll('[data-action="toggle-row"]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(e.target.closest('[data-stop-propagation]')) return;
        const id = Number(el.dataset.id);
        const t = state.trades.find(t=>t.id===id);
        if(t) t._open = !t._open;
        render();
      });
    });
    document.querySelectorAll('[data-action="edit-trade"]').forEach(el=>{
      el.addEventListener('click', (e)=>{
        e.stopPropagation();
        state.editingId = Number(el.dataset.id);
        const t = state.trades.find(t=>t.id===state.editingId);
        state.formPhotos = (t && t.photos) ? t.photos.slice() : [];
        state.amountInputMode = (t && t.amountUsdt) ? 'usdt' : 'krw';
        state.broker = '';
        state.market = 'domestic';
        state.editingFeeRate = false;
        formChecklist = {}; formChecklistNotes = {};
        render();
      });
    });
    document.querySelectorAll('[data-action="delete-trade"]').forEach(el=>{
      el.addEventListener('click', async (e)=>{
        e.stopPropagation();
        if(!confirm('삭제하시겠습니까?')) return;
        const id = Number(el.dataset.id);
        state.trades = state.trades.filter(t=>t.id!==id);
        if(state.editingId===id) state.editingId = null;
        await storageSet('trades', state.trades.map(({_open,_closing, ...rest})=>rest));
        render();
      });
    });
  }

  let formChecklist = {};
  let formChecklistNotes = {};
  let lastFormSession = null;
  let newFormGeneration = 0;

  loadAll();
})();
</script>
</body>
</html>
